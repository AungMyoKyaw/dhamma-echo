<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ece6d4" />
    <link rel="icon" href="../public/logo.svg" type="image/svg+xml" />
    <title>Dhamma Echo — Prototype</title>
    <style>
      @font-face {
        font-family: "Source Serif 4";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("../src/assets/fonts/source-serif-4-latin.woff2") format("woff2");
      }

      :root {
        color-scheme: light;
        --ground: #ece6d4;
        --page: #f4efde;
        --panel: #e3dcc4;
        --ink: #1f2024;
        --muted: #5a5b55;
        --rule: #cbc5b0;
        --green: #3f6b3a;
        --green-hover: #2c4d28;
        --on-green: #f4efde;
        --error: #8d3a2c;
        --error-soft: #efd6cc;
        --serif: "Source Serif 4", "Source Serif Pro", Georgia, serif;
        --sans: Inter, "Noto Sans Myanmar", "Myanmar Text", "Pyidaungsu", system-ui, sans-serif;
        --sidebar-width: 256px;
        --player-height: 84px;
        --icon-label-shift: -1px;
      }

      html[data-sidebar-collapsed="true"] {
        --sidebar-width: 76px;
      }

      [data-theme="dark"] {
        color-scheme: dark;
        --ground: #16180f;
        --page: #1d1f15;
        --panel: #252820;
        --ink: #e6e3d3;
        --muted: #9e9d8a;
        --rule: #3a3b32;
        --green: #7fa572;
        --green-hover: #a4c69b;
        --on-green: #16180f;
        --error: #d68b7a;
        --error-soft: #2d1813;
      }

      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html {
        min-width: 360px;
        background: var(--ground);
      }
      body {
        min-width: 360px;
        margin: 0;
        color: var(--ink);
        background: var(--ground);
        font: 400 14px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        color: inherit;
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      a:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--green) 55%, transparent);
        outline-offset: 3px;
      }
      ::selection {
        color: var(--on-green);
        background: var(--green);
      }
      ::placeholder {
        color: var(--muted);
        opacity: 1;
      }
      .icon {
        width: 20px;
        height: 20px;
        display: block;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .titlebar {
        height: 36px;
        position: fixed;
        z-index: 5;
        inset: 0 0 auto;
        background: var(--ground);
        border-bottom: 1px solid var(--rule);
      }
      .sidebar {
        position: fixed;
        z-index: 4;
        inset: 36px auto 0 0;
        width: var(--sidebar-width);
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 15px 16px 18px;
        background: var(--ground);
        border-right: 1px solid var(--rule);
        overflow-y: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 50px;
        padding: 0 5px;
        color: inherit;
        text-decoration: none;
      }
      .brand-mark {
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--page);
        color: var(--green);
      }
      .brand-mark .icon {
        width: 26px;
        height: 26px;
      }
      .brand-name {
        display: block;
        font-size: 18px;
        font-weight: 750;
        letter-spacing: -0.02em;
      }
      .brand-tagline {
        display: block;
        margin-top: 1px;
        color: var(--muted);
        font-size: 12px;
      }
      .nav {
        display: grid;
        gap: 6px;
        margin-top: 32px;
      }
      .nav-button {
        min-height: 46px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 13px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        text-align: left;
        line-height: 20px;
        font-weight: 620;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
      }
      .nav-button:hover {
        background: var(--panel);
        color: var(--ink);
      }
      .nav-button[aria-current="page"] {
        background: var(--green);
        color: var(--on-green);
      }
      .nav-label,
      .collapse-label {
        display: block;
        line-height: 20px;
      }
      /* One-line labels need optical alignment; icon-only controls do not. */
      .nav-button .icon,
      .collapse-button .icon,
      .search-box .icon {
        width: 20px;
        height: 20px;
        transform: translateY(var(--icon-label-shift));
      }
      .sidebar[data-collapsed="true"] {
        align-items: center;
        padding-inline: 9px;
      }
      .sidebar[data-collapsed="true"] .nav {
        width: 100%;
      }
      .sidebar[data-collapsed="true"] .brand,
      .sidebar[data-collapsed="true"] .nav-button,
      .sidebar[data-collapsed="true"] .collapse-button {
        justify-content: center;
        padding-inline: 0;
      }
      .sidebar[data-collapsed="true"] .brand-copy,
      .sidebar[data-collapsed="true"] .nav-label,
      .sidebar[data-collapsed="true"] .privacy,
      .sidebar[data-collapsed="true"] .collapse-label {
        display: none;
      }
      .sidebar[data-collapsed="true"] .nav-button .icon,
      .sidebar[data-collapsed="true"] .collapse-button .icon {
        transform: none;
      }
      .sidebar-bottom {
        margin-top: auto;
      }
      .privacy {
        padding: 14px;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background: var(--panel);
      }
      .privacy-mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        margin-bottom: 9px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--green) 12%, transparent);
        color: var(--green);
      }
      .privacy-mark .icon {
        width: 17px;
        height: 17px;
      }
      .privacy strong {
        display: block;
        font-size: 14px;
      }
      .privacy p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }
      .collapse-button {
        width: 100%;
        height: 42px;
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 8px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        text-align: left;
        font-size: 12px;
        line-height: 20px;
        font-weight: 650;
      }
      .collapse-button:hover {
        background: var(--panel);
        color: var(--ink);
      }
      .app-main {
        min-height: 100vh;
        margin-left: var(--sidebar-width);
        padding: 62px 40px calc(var(--player-height) + 44px);
      }
      .content {
        width: min(100%, 1200px);
        margin: 0 auto;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 29px;
      }
      h1,
      h2 {
        font-family: var(--serif);
        font-weight: 600;
        text-wrap: balance;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.13;
        letter-spacing: -0.02em;
      }
      h2 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
        letter-spacing: -0.015em;
      }
      h3 {
        margin: 0;
        font-size: 14px;
        line-height: 1.4;
        font-weight: 700;
        text-wrap: balance;
      }
      .page-description {
        margin: 6px 0 0;
        color: var(--muted);
      }
      .sample-note {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 12px;
      }
      .home-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(250px, 0.83fr);
        gap: 28px;
        align-items: start;
      }
      .main-stack,
      .side-stack {
        display: grid;
        gap: 29px;
        min-width: 0;
      }
      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }
      .section-description {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .link-button {
        min-height: 40px;
        padding: 0 3px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-weight: 700;
        white-space: nowrap;
        text-underline-offset: 4px;
      }
      .link-button:hover {
        color: var(--ink);
        text-decoration: underline;
      }
      .resume-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: center;
        min-height: 176px;
        padding: 23px 24px;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background: var(--page);
      }
      .resume-copy {
        min-width: 0;
      }
      .resume-title {
        margin-top: 8px;
        font-size: clamp(20px, 2.2vw, 24px);
        line-height: 1.2;
        letter-spacing: -0.015em;
      }
      .resume-teacher {
        margin: 5px 0 0;
        color: var(--muted);
      }
      .resume-context {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 15px;
        color: var(--muted);
        font-size: 12px;
      }
      .separator {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--rule);
      }
      .play-button {
        width: 54px;
        height: 54px;
        padding: 0;
        line-height: 1;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: var(--green);
        color: var(--on-green);
        box-shadow: 0 4px 12px color-mix(in srgb, var(--green) 25%, transparent);
        transition:
          background-color 0.15s ease,
          transform 0.15s ease;
      }
      .play-button:hover {
        background: var(--green-hover);
        transform: translateY(-1px);
      }
      .play-button .icon {
        width: 22px;
        height: 22px;
      }
      .progress-track {
        width: 100%;
        height: 4px;
        margin-top: 17px;
        overflow: hidden;
        border-radius: 99px;
        background: var(--panel);
      }
      .progress-fill {
        width: 36%;
        height: 100%;
        border-radius: inherit;
        background: var(--green);
      }
      .recent-list {
        overflow: hidden;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background: var(--page);
      }
      .track-row {
        min-height: 84px;
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--rule);
      }
      .track-row:last-child {
        border-bottom: 0;
      }
      .track-row[data-current="true"] {
        background: color-mix(in srgb, var(--green) 6%, var(--page));
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--green) 22%, transparent);
      }
      .row-play {
        width: 44px;
        height: 44px;
        padding: 0;
        line-height: 1;
        display: grid;
        place-items: center;
        border: 1px solid var(--rule);
        border-radius: 50%;
        background: var(--ground);
        color: var(--ink);
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }
      .row-play:hover:not(:disabled) {
        background: var(--panel);
        border-color: var(--muted);
      }
      .row-play.is-current {
        border-color: transparent;
        background: var(--green);
        color: var(--on-green);
      }
      .row-play.is-current:hover {
        border-color: transparent;
        background: var(--green-hover);
      }
      .row-play:disabled {
        cursor: not-allowed;
        color: var(--muted);
        border-style: dashed;
        background: transparent;
      }
      .row-play .icon {
        width: 20px;
        height: 20px;
      }
      .track-copy {
        min-width: 0;
      }
      .track-title {
        display: block;
        max-width: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--ink);
        text-align: left;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.45;
      }
      .track-title:hover:not(:disabled) {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .track-title:disabled {
        cursor: default;
      }
      .track-title.myanmar-text {
        line-height: 1.8;
      }
      .track-copy .track-meta {
        display: block;
        overflow: hidden;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .track-state {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }
      .row-actions {
        display: flex;
        align-items: center;
        gap: 0;
      }
      .icon-button {
        width: 36px;
        height: 36px;
        padding: 0;
        line-height: 1;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
      }
      .icon-button:hover {
        background: var(--panel);
        color: var(--ink);
      }
      .row-actions .icon-button {
        width: 44px;
        height: 44px;
      }
      .icon-button[aria-pressed="true"] {
        color: var(--ink);
      }
      .row-actions [aria-pressed="true"] .icon {
        fill: currentColor;
      }
      .icon-button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .icon-button .icon {
        width: 18px;
        height: 18px;
      }
      .teacher-list {
        display: grid;
        border-top: 1px solid var(--rule);
      }
      .teacher-row {
        min-height: 68px;
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) 16px;
        align-items: center;
        gap: 11px;
        padding: 10px 3px;
        border-bottom: 1px solid var(--rule);
        color: inherit;
        text-decoration: none;
      }
      .teacher-row:hover .teacher-name {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .teacher-initial {
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--page);
        color: var(--muted);
        font-family: var(--serif);
        font-size: 18px;
      }
      .teacher-name {
        display: block;
        font-weight: 700;
        line-height: 1.35;
      }
      .teacher-count {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }
      .teacher-row > .icon {
        width: 16px;
        height: 16px;
        color: var(--muted);
      }
      .browse-links {
        display: grid;
        gap: 0;
        border-top: 1px solid var(--rule);
      }
      .browse-link {
        min-height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--rule);
        color: inherit;
        text-decoration: none;
        font-weight: 650;
      }
      .browse-link:hover {
        color: var(--green);
      }
      .browse-link small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
      }
      .browse-link .icon {
        width: 16px;
        height: 16px;
        color: var(--muted);
      }
      .player {
        position: fixed;
        z-index: 6;
        right: 0;
        bottom: 0;
        left: var(--sidebar-width);
        min-height: var(--player-height);
        display: grid;
        grid-template-columns: minmax(170px, 0.85fr) minmax(260px, 1.5fr) minmax(150px, 0.8fr);
        align-items: center;
        gap: 22px;
        padding: 9px 24px;
        border-top: 1px solid var(--rule);
        background: var(--page);
        box-shadow: 0 -4px 12px rgb(31 32 36 / 0.08);
      }
      .player-track {
        min-width: 0;
      }
      .player-track strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }
      .player-track span {
        display: block;
        overflow: hidden;
        margin-top: 2px;
        color: var(--muted);
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }
      .transport {
        min-width: 0;
        display: grid;
        justify-items: center;
        gap: 0;
      }
      .transport-controls {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .transport-controls .icon-button {
        width: 34px;
        height: 34px;
      }
      .transport-controls .play-button {
        width: 37px;
        height: 37px;
      }
      .transport-controls .play-button .icon {
        width: 18px;
        height: 18px;
      }
      .scrubber {
        width: 100%;
        display: grid;
        grid-template-columns: 34px minmax(50px, 1fr) 34px;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] {
        width: 100%;
        height: 4px;
        margin: 0;
        accent-color: var(--green);
        cursor: pointer;
      }
      .player-actions {
        display: flex;
        justify-content: end;
        align-items: center;
        gap: 8px;
      }
      .player-actions select {
        height: 36px;
        min-width: 62px;
        padding: 0 8px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--ground);
        font-size: 12px;
      }
      .queue-button {
        position: relative;
      }
      .queue-count {
        position: absolute;
        top: -1px;
        right: -1px;
        min-width: 17px;
        height: 17px;
        display: none;
        place-items: center;
        padding: 0 3px;
        border: 2px solid var(--page);
        border-radius: 999px;
        background: var(--green);
        color: var(--on-green);
        font-size: 12px;
        font-weight: 750;
      }
      .queue-count.visible {
        display: grid;
      }
      .search-box {
        min-height: 50px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--ground);
      }
      .search-box .icon {
        color: var(--muted);
      }
      .search-box input {
        width: 100%;
        min-width: 0;
        padding: 0;
        line-height: 20px;
        border: 0;
        outline: 0;
        background: transparent;
      }
      .search-box input:focus-visible {
        outline: 0;
      }
      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0 24px;
      }
      .filter-chip {
        min-height: 34px;
        padding: 0 13px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: var(--panel);
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }
      .filter-chip:hover {
        border-color: color-mix(in srgb, var(--green) 45%, var(--rule));
        color: var(--ink);
      }
      .filter-chip[aria-pressed="true"] {
        background: var(--green);
        color: var(--on-green);
      }
      .catalogue-list {
        overflow: hidden;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background: var(--page);
      }
      .catalogue-list .track-row {
        min-height: 82px;
      }
      .empty-state {
        padding: 24px;
        border: 1px solid var(--rule);
        border-radius: 12px;
        color: var(--muted);
      }
      .empty-state strong {
        display: block;
        margin-bottom: 4px;
        color: var(--ink);
      }
      .tile-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
        gap: 12px;
      }
      .tile {
        min-height: 120px;
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 18px;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background: var(--page);
        color: inherit;
        text-align: left;
        text-decoration: none;
      }
      .tile:hover {
        background: color-mix(in srgb, var(--panel) 45%, var(--page));
      }
      .tile-mark {
        width: 48px;
        height: 48px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border: 1px solid var(--rule);
        border-radius: 8px;
        color: var(--green);
      }
      .tile-mark .icon {
        width: 22px;
        height: 22px;
      }
      .tile strong {
        display: block;
        font-size: 14px;
      }
      .tile small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
      }
      .setting-group {
        border-top: 1px solid var(--rule);
      }
      .setting-row {
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        border-bottom: 1px solid var(--rule);
      }
      .setting-row strong {
        display: block;
      }
      .setting-row small {
        display: block;
        margin-top: 3px;
        color: var(--muted);
      }
      .setting-row select {
        min-height: 38px;
        padding: 0 10px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--ground);
      }
      .theme-button,
      .secondary-button {
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: transparent;
        font-size: 12px;
        font-weight: 700;
      }
      .theme-button:hover,
      .secondary-button:hover {
        background: var(--panel);
      }
      .primary-button {
        min-height: 43px;
        padding: 0 17px;
        border: 0;
        border-radius: 8px;
        background: var(--green);
        color: var(--on-green);
        font-weight: 700;
      }
      .primary-button:hover {
        background: var(--green-hover);
      }
      .toast {
        position: fixed;
        z-index: 9;
        right: 24px;
        bottom: calc(var(--player-height) + 18px);
        max-width: min(360px, calc(100vw - 32px));
        padding: 11px 15px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--page);
        color: var(--ink);
        box-shadow: 0 4px 14px rgb(31 32 36 / 0.12);
        opacity: 0;
        pointer-events: none;
        transform: translateY(5px);
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
      }
      .toast.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .mobile-menu {
        display: none;
      }
      .myanmar-text {
        line-height: 1.8;
        word-break: keep-all;
        overflow-wrap: normal;
      }

      @media (max-width: 1120px) {
        :root {
          --sidebar-width: 224px;
        }
        .app-main {
          padding-right: 25px;
          padding-left: 25px;
        }
        .home-layout {
          grid-template-columns: minmax(0, 1.5fr) minmax(220px, 0.8fr);
          gap: 22px;
        }
        .player {
          grid-template-columns: minmax(130px, 0.8fr) minmax(230px, 1.3fr) minmax(120px, 0.65fr);
          gap: 13px;
          padding-inline: 16px;
        }
      }
      @media (max-width: 860px) {
        :root,
        html[data-sidebar-collapsed="true"] {
          --sidebar-width: 70px;
          --player-height: 126px;
        }
        .sidebar .nav-button .icon,
        .sidebar .collapse-button .icon {
          transform: none;
        }
        .sidebar {
          align-items: center;
          padding-inline: 9px;
        }
        .brand {
          justify-content: center;
          padding: 0;
        }
        .brand-copy,
        .nav-label,
        .privacy,
        .collapse-label {
          display: none;
        }
        .nav {
          width: 100%;
          margin-top: 24px;
        }
        .nav-button {
          justify-content: center;
          padding: 0;
        }
        .collapse-button {
          justify-content: center;
          padding: 0;
        }
        .app-main {
          padding: 58px 22px calc(var(--player-height) + 28px);
        }
        .home-layout {
          grid-template-columns: 1fr;
        }
        .side-stack {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 20px;
        }
        .player {
          grid-template-columns: minmax(0, 1fr) auto;
          grid-template-rows: 39px 58px;
          gap: 1px 12px;
          padding: 7px 14px 8px;
        }
        .player-track {
          grid-column: 1;
          grid-row: 1;
        }
        .player-actions {
          grid-column: 2;
          grid-row: 1;
        }
        .transport {
          grid-column: 1 / -1;
          grid-row: 2;
          grid-template-columns: auto minmax(0, 1fr);
          gap: 14px;
        }
        .scrubber {
          min-width: 0;
        }
        .page-heading {
          align-items: start;
        }
      }
      @media (max-width: 560px) {
        :root,
        html[data-sidebar-collapsed="true"] {
          --sidebar-width: 0px;
        }
        .sidebar {
          display: none;
        }
        .mobile-menu {
          position: fixed;
          z-index: 8;
          top: 42px;
          right: 16px;
          display: block;
        }
        .mobile-menu summary {
          width: 42px;
          height: 42px;
          display: grid;
          place-items: center;
          border: 1px solid var(--rule);
          border-radius: 8px;
          background: var(--page);
          list-style: none;
          cursor: pointer;
        }
        .mobile-menu[open] .mobile-nav {
          position: absolute;
          top: 48px;
          right: 0;
          width: 210px;
          display: grid;
          gap: 3px;
          padding: 9px;
          border: 1px solid var(--rule);
          border-radius: 12px;
          background: var(--page);
        }
        .mobile-nav .nav-button {
          justify-content: start;
          padding-inline: 10px;
        }
        .mobile-nav .nav-label {
          display: block;
        }
        .mobile-menu summary::-webkit-details-marker {
          display: none;
        }
        .app-main {
          padding: 66px 18px calc(var(--player-height) + 24px);
        }
        .page-heading {
          display: block;
          padding-right: 48px;
        }
        .sample-note {
          display: block;
          margin-top: 7px;
        }
        h1 {
          font-size: 28px;
        }
        .resume-card {
          grid-template-columns: minmax(0, 1fr) auto;
          min-height: 0;
          padding: 18px;
        }
        .resume-title {
          font-size: 20px;
        }
        .resume-context {
          flex-wrap: wrap;
          gap: 6px;
        }
        .side-stack {
          grid-template-columns: 1fr;
        }
        .track-row {
          grid-template-columns: 44px minmax(0, 1fr) auto;
          gap: 10px;
          padding-inline: 12px;
        }
        .row-actions {
          grid-column: 2 / -1;
          justify-content: end;
          margin-top: -4px;
        }
        .track-state {
          grid-column: auto;
        }
        .player {
          left: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <svg

    >

    <div class="titlebar" aria-hidden="true"></div>
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#home" aria-label="Dhamma Echo home">
        <span class="brand-mark"
          ><img src="../public/logo.svg" alt="" width="34" height="34"
        /></span>
        <span class="brand-copy"
          ><span class="brand-name">Dhamma Echo</span
          ><span class="brand-tagline">Listen with intention</span></span
        >
      </a>
      <nav class="nav" id="desktop-nav" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <div class="privacy">
          <span class="privacy-mark"
            ><svg class="icon"><use href="#i-leaf" /></svg></span
          ><strong>A quiet library</strong>
          <p>Your catalogue stays on this device. Audio streams only when you press play.</p>
        </div>
        <button class="collapse-button" id="collapse-sidebar" type="button">
          <svg class="icon"><use href="#i-collapse" /></svg
          ><span class="collapse-label">Collapse</span>
        </button>
      </div>
    </aside>
    <details class="mobile-menu">
      <summary aria-label="Open navigation">
        <svg class="icon"><use href="#i-menu" /></svg>
      </summary>
      <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
    </details>

    <main class="app-main"><div class="content" id="view" tabindex="-1"></div></main>

    <footer class="player" aria-label="Persistent audio player">
      <div class="player-track" aria-live="polite">
        <strong id="player-title">Mindfulness of Breathing</strong
        ><span id="player-teacher">Pa-Auk Tawya Sayadaw · sample data</span>
      </div>
      <div class="transport">
        <div class="transport-controls">
          <button class="icon-button" type="button" data-action="back" aria-label="Back 15 seconds">
            <svg class="icon"><use href="#i-back" /></svg>
          </button>
          <button class="play-button" type="button" data-action="toggle" aria-label="Play">
            <svg class="icon"><use href="#i-play" /></svg>
          </button>
          <button
            class="icon-button"
            type="button"
            data-action="forward"
            aria-label="Forward 15 seconds"
          >
            <svg class="icon"><use href="#i-forward" /></svg>
          </button>
        </div>

          <span id="time-current">18:42</span
          ><input
            id="player-range"
            type="range"
            min="0"
            max="100"
            value="36"
            aria-label="Playback position"
          /><span id="time-duration">52:10</span>

          ><span class="sr-only" style="position: absolute; clip: rect(0, 0, 0, 0)"

    <script>
      const routes = [
        { id: "home", label: "Home", icon: "home" },
        { id: "explore", label: "Explore", icon: "search" },
        { id: "collections", label: "Collections", icon: "collection" },
        { id: "teachers", label: "Teachers", icon: "teachers" },
        { id: "library", label: "My library", icon: "library" },
        { id: "settings", label: "Settings", icon: "settings" }
      ];
      const tracks = [
        {
          title: "Mindfulness of Breathing",
          teacher: "Pa-Auk Tawya Sayadaw",
          lang: "English",
          duration: "52 min",
          format: "MP3",
          playable: true
        },
        {
          title: "Praise and Blame",
          teacher: "Venerable Sayadaw U Jotika",
          lang: "English",
          duration: "46 min",
          format: "MP3",
          playable: true
        },
        {
          title: "မေတ္တာပို့",
          teacher: "Venerable Dr. K. Dhammasami",
          lang: "မြန်မာ",
          duration: "38 min",
          format: "MP3",
          playable: true,
          myanmar: true
        },
        {
          title: "Living with Awareness",
          teacher: "Venerable Sayadaw U Jotika",
          lang: "English",
          duration: "41 min",
          format: "MP3",
          playable: true
        },
        {
          title: "သတိပဋ္ဌာန် တရားတော်",
          teacher: "Sitagu Sayadaw",
          lang: "မြန်မာ",
          duration: "—",
          format: "WMA",
          playable: false,
          myanmar: true
        }
      ];
      const teachers = [
        { name: "Venerable Sayadaw U Jotika", count: "120 talks", initial: "J" },
        { name: "Pa-Auk Tawya Sayadaw", count: "744 talks", initial: "P" },
        { name: "Mogok Sayadaw", count: "960 talks", initial: "M" },
        { name: "Venerable Dr. K. Dhammasami", count: "80 talks", initial: "D" }
      ];
      const titles = {
        home: ["Good to have you back", "Pick up where you left off, or find a new teaching."],
        explore: [
          "Explore the catalogue",
          "Search talks by title or teacher, then narrow by language and format."
        ],
        collections: ["Collections", "Browse talks gathered by teacher and series."],
        teachers: ["Teachers", "Find a trusted voice in the catalogue."],
        library: ["My library", "Your saved talks and listening history stay on this device."],
        settings: ["Settings", "Shape playback and appearance around your listening practice."]
      };
      let activeRoute = "home";
      let playing = false;
      let currentIndex = 0;
      let queue = [];
      let favorites = new Set(["Praise and Blame"]);
      let filter = "All";
      let toastTimer;
      const view = document.querySelector("#view");
      const icon = (name) =>
        `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
      const safe = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]
        );
      const navMarkup = () =>
        routes
          .map(
            (route) =>
              `<button class="nav-button" type="button" data-route="${route.id}" aria-label="${route.label}" ${activeRoute === route.id ? 'aria-current="page"' : ""}>${icon(route.icon)}<span class="nav-label">${route.label}</span></button>`
          )
          .join("");
      function drawNav() {
        document.querySelector("#desktop-nav").innerHTML = navMarkup();
        document.querySelector("#mobile-nav").innerHTML = navMarkup();
      }
      function heading(route) {
        const [title, description] = titles[route];
        return `<header class="page-heading"><div><h1>${title}</h1><p class="page-description">${description}</p></div><span class="sample-note">Prototype · illustrative catalogue data</span></header>`;
      }
      function trackRow(track, index, actions = true) {
        const title = safe(track.title),
          teacher = safe(track.teacher);
        const language = safe(track.lang),
          format = safe(track.format),
          duration = safe(track.duration);
        return `<article class="track-row" data-track-row data-index="${index}" data-title="${title.toLowerCase()}" data-teacher="${teacher.toLowerCase()}" data-language="${language.toLowerCase()}" data-format="${format.toLowerCase()}">
          <button class="row-play" type="button" data-action="play-track" data-index="${index}" aria-label="Play ${title}" ${track.playable ? "" : `disabled title="${format} playback is unavailable"`}>${icon("play")}</button>
          <div class="track-copy"><button class="track-title ${track.myanmar ? "myanmar-text" : ""}" ${track.myanmar ? 'lang="my"' : ""} type="button" data-action="play-track" data-index="${index}" aria-label="Play ${title}" ${track.playable ? "" : "disabled"}>${title}</button><span class="track-meta">${teacher} · ${language} · ${duration}${!track.playable ? " · WMA playback unavailable" : ""}</span><span class="track-state" hidden></span></div>
          ${actions ? `<div class="row-actions"><button class="icon-button" type="button" data-action="favorite" data-title="${title}" aria-label="${favorites.has(track.title) ? "Remove saved talk" : "Save"}: ${title}" aria-pressed="${favorites.has(track.title)}" title="${favorites.has(track.title) ? "Remove saved talk" : "Save talk"}">${icon("heart")}</button><button class="icon-button queue-action" type="button" data-action="add-queue" data-index="${index}" aria-label="Add ${title} to queue" title="Add to queue" ${track.playable ? "" : "disabled"}>${icon("queue")}</button></div>` : `<span class="sample-note">${format}</span>`}
        </article>`;
      }
      function teacherRow(teacher) {
        return `<a class="teacher-row" href="#teachers" data-route-link="teachers"><span class="teacher-initial" aria-hidden="true">${safe(teacher.initial)}</span><span><span class="teacher-name">${safe(teacher.name)}</span><span class="teacher-count">${safe(teacher.count)}</span></span>${icon("chevron")}</a>`;
      }
      function renderHome() {
        return `${heading("home")}<div class="home-layout"><div class="main-stack">
          <section aria-labelledby="resume-heading"><div class="section-head"><div><h2 id="resume-heading">Continue listening</h2><p class="section-description">Your last session is ready when you are.</p></div></div>
            <div class="resume-card"><div class="resume-copy"><span class="sample-note">Last listened · sample session</span><h3 class="resume-title">Mindfulness of Breathing</h3><p class="resume-teacher">Pa-Auk Tawya Sayadaw</p><div class="resume-context"><span>Resume at 18:42</span><span class="separator"></span><span>English · Audio</span></div><div class="progress-track" aria-label="36 percent listened"><div class="progress-fill"></div></div></div><button class="play-button" type="button" data-action="play-track" data-index="0" aria-label="Resume Mindfulness of Breathing">${icon("play")}</button></div>
          </section>
          <section aria-labelledby="recent-heading"><div class="section-head"><div><h2 id="recent-heading">Recently played</h2><p class="section-description">Return to a talk from your recent listening.</p></div><button class="link-button" type="button" data-route="library">View history</button></div><div class="recent-list">${tracks
            .slice(1, 4)
            .map((track, index) => trackRow(track, index + 1))
            .join("")}</div></section>
        </div><aside class="side-stack">
          <section aria-labelledby="teachers-heading"><div class="section-head"><div><h2 id="teachers-heading">Featured teachers</h2><p class="section-description">A few voices to explore.</p></div><button class="link-button" type="button" data-route="teachers">All teachers</button></div><div class="teacher-list">${teachers.slice(0, 3).map(teacherRow).join("")}</div></section>
          <section aria-labelledby="browse-heading"><div class="section-head"><div><h2 id="browse-heading">Browse by</h2><p class="section-description">Choose a path into the catalogue.</p></div></div><div class="browse-links"><a class="browse-link" href="#collections" data-route-link="collections"><span>Collections<small>Talks grouped by teacher</small></span>${icon("chevron")}</a><a class="browse-link" href="#explore" data-route-link="explore"><span>Language and format<small>Audio, video, and more</small></span>${icon("chevron")}</a></div></section>
        </aside></div>`;
      }
      function renderExplore() {
        const visibleTracks = tracks
          .map((track, index) => ({ track, index }))
          .filter(({ track }) => {
            if (filter === "Audio" && track.format !== "MP3" && track.format !== "WMA")
              return false;
            if (filter === "English" && track.lang !== "English") return false;
            if (filter === "Myanmar" && track.lang !== "မြန်မာ") return false;
            if (filter === "Playable" && !track.playable) return false;
            return true;
          });
        return `${heading("explore")}<label class="search-box">${icon("search")}<input id="catalogue-search" type="search" placeholder="Search titles or teachers" autocomplete="off" aria-label="Search titles or teachers" /></label><div class="filter-row" aria-label="Filter catalogue">${["All", "English", "Myanmar", "Audio", "Playable"].map((item) => `<button class="filter-chip" type="button" data-filter="${item}" aria-pressed="${filter === item}">${item}</button>`).join("")}</div><div class="section-head"><div><h2>Talks</h2><p class="section-description" id="result-count">${visibleTracks.length} illustrative records</p></div></div><div class="catalogue-list" id="catalogue-results">${visibleTracks.map(({ track, index }) => trackRow(track, index)).join("")}</div>`;
      }
      function renderTeachers() {
        return `${heading("teachers")}<div class="section-head"><div><h2>Teachers in the prototype</h2><p class="section-description">Illustrative entries from the catalogue preview.</p></div></div><div class="tile-grid">${teachers.map((teacher) => `<a class="tile" href="#explore" data-route-link="explore"><span class="teacher-initial">${safe(teacher.initial)}</span><span><strong>${safe(teacher.name)}</strong><small>${safe(teacher.count)}</small></span></a>`).join("")}</div>`;
      }
      function renderCollections() {
        return `${heading("collections")}<div class="section-head"><div><h2>Browse collections</h2><p class="section-description">Collection names and counts shown here are illustrative.</p></div></div><div class="tile-grid"><button class="tile" type="button" data-action="notice" data-message="Collection detail is represented by this prototype entry."><span class="tile-mark">${icon("collection")}</span><span><strong>Dhamma Disc</strong><small>Venerable Sayadaw U Jotika · 2 talks</small></span></button><button class="tile" type="button" data-action="notice" data-message="Collection detail is represented by this prototype entry."><span class="tile-mark">${icon("collection")}</span><span><strong>Talks on Awareness</strong><small>Venerable Dr. K. Dhammasami · 8 talks</small></span></button></div>`;
      }
      function renderLibrary() {
        const saved = tracks.filter((track) => favorites.has(track.title));
        return `${heading("library")}<div class="home-layout"><section><div class="section-head"><div><h2>Saved talks</h2><p class="section-description">Favorites stay on this device.</p></div></div><div class="recent-list">${saved.length ? saved.map((track) => trackRow(track, tracks.indexOf(track))).join("") : `<div class="empty-state"><strong>No saved talks yet</strong>Use the heart on a talk to keep it here.</div>`}</div></section><section><div class="section-head"><div><h2>Listening history</h2><p class="section-description">Recent activity · sample data</p></div></div><div class="recent-list">${tracks
          .slice(0, 3)
          .map((track, index) => trackRow(track, index, false))
          .join("")}</div></section></div>`;
      }
      function renderSettings() {
        return `${heading("settings")}<section><div class="section-head"><div><h2>Appearance</h2><p class="section-description">Choose how the library looks in this preview.</p></div></div><div class="setting-group"><div class="setting-row"><span><strong>Theme</strong><small>Follow the system, or choose a fixed appearance.</small></span><select id="theme-select" aria-label="Appearance theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="setting-row"><span><strong>Playback speed</strong><small>Starting speed for new talks.</small></span><select aria-label="Default playback speed"><option>0.75×</option><option selected>1×</option><option>1.25×</option><option>1.5×</option><option>1.75×</option><option>2×</option></select></div></div></section><section style="margin-top:32px"><div class="section-head"><div><h2>Privacy</h2><p class="section-description">Personal library state stays on this device.</p></div></div><div class="empty-state"><strong>No account. No tracking.</strong>The catalogue is bundled with the application. Media streams only after you choose to play.</div></section>`;
      }
      function render() {
        drawNav();
        view.innerHTML = {
          home: renderHome,
          explore: renderExplore,
          collections: renderCollections,
          teachers: renderTeachers,
          library: renderLibrary,
          settings: renderSettings
        }[activeRoute]();
        if (activeRoute === "explore") bindExploreSearch();
        syncPlayback();
      }
      function navigate(route) {
        if (!titles[route]) return;
        activeRoute = route;
        document.querySelector(".mobile-menu").removeAttribute("open");
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function toast(message) {
        const node = document.querySelector("#toast");
        node.textContent = message;
        node.classList.add("visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => node.classList.remove("visible"), 2200);
      }
      function durationSeconds() {
        return currentIndex === 0 ? 3130 : Number.parseInt(tracks[currentIndex].duration, 10) * 60;
      }
      function formatTime(seconds) {
        return `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
      }
      function seek(seconds) {
        const duration = durationSeconds();
        const position = Math.min(duration, Math.max(0, seconds));
        document.querySelector("#player-range").value = String((position / duration) * 100);
        document.querySelector("#time-current").textContent = formatTime(Math.round(position));
      }
      function syncPlayback() {
        const track = tracks[currentIndex];
        document.querySelector("#time-duration").textContent = formatTime(durationSeconds());
        document.querySelector("#player-title").textContent = track.title;
        document.querySelector("#player-teacher").textContent =
          `${track.teacher} · ${playing ? "Playing" : "Paused"} · prototype`;
        const toggle = document.querySelector('[data-action="toggle"]');
        toggle.innerHTML = icon(playing ? "pause" : "play");
        toggle.setAttribute("aria-label", `${playing ? "Pause" : "Play"} ${track.title}`);
        toggle.setAttribute("aria-pressed", String(playing));
        document.querySelectorAll('[data-action="play-track"]').forEach((button) => {
          const index = Number(button.dataset.index);
          const current = index === currentIndex;
          const pause = current && playing;
          const item = tracks[index];
          const label = item.playable
            ? `${pause ? "Pause" : "Play"} ${item.title}`
            : `${item.title}: ${item.format} playback unavailable`;
          button.setAttribute("aria-label", label);
          button.setAttribute("title", label);
          button.setAttribute("aria-pressed", String(pause));
          if (!button.classList.contains("track-title")) {
            button.classList.toggle("is-current", current);
            button.innerHTML = icon(pause ? "pause" : "play");
          }
        });
        document.querySelectorAll("[data-track-row]").forEach((row) => {
          const current = Number(row.dataset.index) === currentIndex;
          row.dataset.current = String(current);
          const status = row.querySelector(".track-state");
          status.hidden = !current;
          status.textContent = current ? (playing ? "Playing" : "Paused") : "";
        });
      }
      function setPlaying(next = !playing) {
        playing = next;
        syncPlayback();
        toast(
          playing ? "Playback simulated in this prototype; no audio streams." : "Playback paused"
        );
      }
      function playTrack(index) {
        const track = tracks[index];
        if (!track?.playable) return;
        if (index === currentIndex) {
          setPlaying();
        } else {
          currentIndex = index;
          document.querySelector("#player-range").value = "0";
          document.querySelector("#time-current").textContent = "00:00";
          setPlaying(true);
        }
      }
      function addQueue(track) {
        queue.push(track);
        const badge = document.querySelector("#queue-count");
        badge.textContent = String(queue.length);
        badge.classList.add("visible");
        toast(`Added “${track.title}” to queue`);
      }
      function bindExploreSearch() {
        const input = document.querySelector("#catalogue-search");
        input.addEventListener("input", () => {
          const query = input.value.trim().toLocaleLowerCase();
          let count = 0;
          document.querySelectorAll("#catalogue-results [data-track-row]").forEach((row) => {
            const match = row.dataset.title.includes(query) || row.dataset.teacher.includes(query);
            row.hidden = !match;
            if (match) count += 1;
          });
          document.querySelector("#result-count").textContent = `${count} illustrative records`;
        });
      }
      document.addEventListener("click", (event) => {
        const target = event.target.closest(
          "[data-route], [data-route-link], [data-action], [data-filter]"
        );
        if (!target) return;
        if (target.dataset.route || target.dataset.routeLink) {
          event.preventDefault();
          navigate(target.dataset.route || target.dataset.routeLink);
        } else if (target.dataset.filter) {
          filter = target.dataset.filter;
          render();
        } else if (target.dataset.action === "play-track") {
          playTrack(Number(target.dataset.index));
        } else if (target.dataset.action === "favorite") {
          const title = target.dataset.title;
          favorites.has(title) ? favorites.delete(title) : favorites.add(title);
          document.querySelectorAll('[data-action="favorite"]').forEach((button) => {
            if (button.dataset.title !== title) return;
            const saved = favorites.has(title);
            button.setAttribute("aria-pressed", String(saved));
            button.setAttribute("aria-label", `${saved ? "Remove saved talk" : "Save"}: ${title}`);
            button.title = saved ? "Remove saved talk" : "Save talk";
          });
          toast(favorites.has(title) ? "Saved to My library" : "Removed from My library");
        } else if (target.dataset.action === "add-queue") {
          addQueue(tracks[Number(target.dataset.index)]);
        } else if (target.dataset.action === "toggle") {
          setPlaying();
        } else if (target.dataset.action === "back" || target.dataset.action === "forward") {
          const position =
            (Number(document.querySelector("#player-range").value) / 100) * durationSeconds();
          seek(position + (target.dataset.action === "back" ? -15 : 15));
        } else if (target.dataset.action === "queue") {
          toast(
            queue.length
              ? `${queue.length} talk${queue.length === 1 ? "" : "s"} in queue`
              : "Queue is empty"
          );
        } else if (target.dataset.action === "theme") {
          setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
        } else if (target.dataset.action === "notice") {
          toast(target.dataset.message);
        }
      });
      function setTheme(theme) {
        const resolved =
          theme === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
        document.documentElement.dataset.theme = resolved;
        const select = document.querySelector("#theme-select");
        if (select) select.value = theme;
      }
      document.addEventListener("change", (event) => {
        if (event.target.id === "theme-select") setTheme(event.target.value);
      });
      document.querySelector("#collapse-sidebar").addEventListener("click", () => {
        const sidebar = document.querySelector(".sidebar");
        const collapsed = sidebar.dataset.collapsed !== "true";
        sidebar.dataset.collapsed = String(collapsed);
        document.documentElement.dataset.sidebarCollapsed = String(collapsed);
        document
          .querySelector("#collapse-sidebar svg use")
          .setAttribute("href", collapsed ? "#i-chevron" : "#i-collapse");
        document.querySelector("#collapse-sidebar").title = collapsed
          ? "Expand sidebar"
          : "Collapse sidebar";
      });
      document.querySelector("#player-range").addEventListener("input", (event) => {
        seek((Number(event.target.value) / 100) * durationSeconds());
      });
      document.addEventListener("keydown", (event) => {
        if (
          event.key === "/" &&
          !["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)
        ) {
          event.preventDefault();
          navigate("explore");
          document.querySelector("#catalogue-search").focus();
        }
        if (
          event.code === "Space" &&
          !["INPUT", "SELECT", "TEXTAREA", "BUTTON"].includes(document.activeElement.tagName)
        ) {
          event.preventDefault();
          setPlaying();
        }
      });
      render();
    </script>
  </body>
</html>
