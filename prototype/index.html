<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Dhamma Echo · Interactive prototype</title>
    <link rel="icon" href="../public/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./parity.css" />
    <link rel="stylesheet" href="./video.css" />
    <script src="./messages.js" defer></script>
    <script src="./data.js" defer></script>
    <script src="./video.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="0"
      height="0"
      class="symbol-sheet"
      aria-hidden="true"
    >
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.8" />
        <path d="m16 16 5 5" />
      </symbol>
      <symbol id="i-collection" viewBox="0 0 24 24">
        <path d="M4 4h16v16H4zM9 4v16M12 8h5M12 12h5M12 16h5" />
      </symbol>
      <symbol id="i-teachers" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3" />
        <path d="M3 20v-1a6 6 0 0 1 12 0v1zM16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v1h-3" />
      </symbol>
      <symbol id="i-library" viewBox="0 0 24 24">
        <path d="M5 4h14v16H5zM9 4v16M12 8h4M12 12h4M12 16h4" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1"
        />
        <circle cx="12" cy="12" r="7" />
      </symbol>
      <symbol id="i-leaf" viewBox="0 0 24 24">
        <path d="M20 4c-8 0-14 2-14 9a6 6 0 0 0 6 6c7 0 8-7 8-15zM5 21c2-5 5-8 10-11" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
      <symbol id="i-collapse" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="m8 5 12 7-12 7z" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M8 5 3 10l5 5M3 10h10a7 7 0 0 1 0 14" />
        <text x="10" y="17" font-size="8" stroke="none" fill="currentColor">15</text>
      </symbol>
      <symbol id="i-forward" viewBox="0 0 24 24">
        <path d="m16 5 5 5-5 5M21 10H11a7 7 0 0 0 0 14" />
        <text x="4" y="17" font-size="8" stroke="none" fill="currentColor">15</text>
      </symbol>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path
          d="M20.8 8.7c0 5-8.8 11-8.8 11s-8.8-6-8.8-11a4.6 4.6 0 0 1 8.8-1.8 4.6 4.6 0 0 1 8.8 1.8z"
        />
      </symbol>
      <symbol id="i-queue" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h10M4 18h10M18 15v6M15 18h6" />
      </symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 5 10 7-10 7zM19 5v14" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24">
        <path d="M6 6h12v12H6z" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-volume" viewBox="0 0 24 24">
        <path d="M3 9h4l5-5v16l-5-5H3zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
      </symbol>
      <symbol id="i-muted" viewBox="0 0 24 24">
        <path d="M3 9h4l5-5v16l-5-5H3zm13 0 5 6m0-6-5 6" />
      </symbol>
      <symbol id="i-exit-fullscreen" viewBox="0 0 24 24">
        <path d="M9 3v6H3m12-6v6h6M9 21v-6H3m12 6v-6h6" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1" />
        <circle cx="12" cy="12" r="1" />
        <circle cx="19" cy="12" r="1" />
      </symbol>
      <symbol id="i-fullscreen" viewBox="0 0 24 24">
        <path d="M3 9V3h6m6 0h6v6M3 15v6h6m6 0h6v-6" />
      </symbol>
      <symbol id="i-music" viewBox="0 0 24 24">
        <path d="M9 18V5l12-2v13M9 9l12-2" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" />
      </symbol>
    </svg>
    <div class="titlebar" aria-hidden="true"></div>
    <a class="skip-link" href="#view">Skip to content</a>
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#home" aria-label="Dhamma Echo home"
        ><span class="brand-mark"
          ><img src="../public/logo.svg" alt="" width="34" height="34" /></span
        ><span class="brand-copy"
          ><span class="brand-name">Dhamma Echo</span
          ><span class="brand-tagline" data-i18n="app.tagline">Listen with intention</span></span
        ></a
      >
      <nav class="nav" id="desktop-nav" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <div class="privacy">
          <span class="privacy-mark"
            ><svg class="icon" aria-hidden="true"><use href="#i-leaf" /></svg></span
          ><strong data-i18n="privacy.title">A quiet library</strong>
          <p>Local sample only. No accounts, tracking, or remote media.</p>
        </div>
        <button class="collapse-button" id="collapse-sidebar" type="button" data-action="collapse">
          <svg class="icon" aria-hidden="true"><use href="#i-collapse" /></svg
          ><span class="collapse-label" data-i18n="nav.collapse">Collapse</span>
        </button>
      </div>
    </aside>
    <details class="mobile-menu">
      <summary aria-label="Open navigation">
        <svg class="icon" aria-hidden="true"><use href="#i-menu" /></svg>
      </summary>
      <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
    </details>
    <main class="app-main"><div class="content" id="view" tabindex="-1"></div></main>
    <footer class="player" id="player" aria-label="Persistent audio player" hidden></footer>
    <div id="media-parking" hidden>
      <video
        id="video-media"
        playsinline
        preload="metadata"
        tabindex="-1"
        aria-label="Silent interface sample"
      ></video>
    </div>
    <dialog id="queue-dialog" class="overlay" aria-labelledby="queue-title"></dialog>
    <dialog id="help-dialog" class="overlay" aria-labelledby="help-title"></dialog>
    <div id="undo" class="undo-notice" role="status" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript
      ><p>
        This interactive prototype requires JavaScript. It does not stream or download real media.
      </p></noscript
    >
  </body>
</html>
