name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Web quality gates
        run: bun run ci
      - name: Upload web build and coverage
        uses: actions/upload-artifact@v7
        with:
          name: web-build-and-coverage
          path: |
            dist
            coverage/coverage-summary.json
          if-no-files-found: error

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features
      - name: Rust production build
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release
      - name: Rust dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
