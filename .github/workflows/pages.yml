name: GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "scripts/site-smoke.mjs"
      - "tests/site*.test.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Verify product site
        run: bun run site:verify
      - name: Download latest Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf docs/downloads
          mkdir -p docs/downloads
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*_x64-setup.exe' \
            --dir docs/downloads \
            --clobber
          shopt -s nullglob
          installers=(docs/downloads/*_x64-setup.exe)
          test "${#installers[@]}" -eq 1
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
