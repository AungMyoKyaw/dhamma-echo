name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            artifact: dist/*.dmg
          - os: ubuntu-22.04
            name: Linux
            artifact: |
              dist/*.tar.gz
              dist/*.deb
          - os: windows-latest
            name: Windows
            artifact: |
              dist/*.zip
              dist/*.exe
              dist/*.msix
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux GPUI & audio prerequisites
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev pkg-config dpkg-dev
      - name: Verify
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: bash scripts/package-macos.sh
      - name: Package Linux
        if: matrix.os == 'ubuntu-22.04'
        run: bash scripts/package-linux.sh
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command "ISCC.exe" -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          pwsh -File scripts/package-windows.ps1
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Dhamma Echo $TAG" \
              --notes "Native GPUI desktop installers for macOS, Linux, and Windows. See CHANGELOG.md."
          fi
