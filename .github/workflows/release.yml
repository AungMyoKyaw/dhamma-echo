name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
          - platform: windows-latest
            args: ""
            rust-target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.rust-target }}
      - name: Install Tauri Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify web application
        run: bun run verify:web
      - name: Build and upload native bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Dhamma Echo v__VERSION__
          releaseBody: See the attached platform installers and CHANGELOG.md.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
  build-msix:
    name: Package MSIX for Microsoft Store
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Pillow for MSIX asset generation
        run: python -m pip install --upgrade pip && python -m pip install Pillow
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify web application
        run: bun run verify:web
      - name: Verify MSIX manifest template and Store assets
        run: bun run icons:msix:check
      - name: Build Tauri Windows binary (no installer)
        run: bun run tauri -- build --no-bundle
      - uses: microsoft/setup-WinAppCli@v0.1
      - name: Read Tauri version
        id: tauri-version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Substitute MSIX manifest placeholders
        env:
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
        shell: pwsh
        run: |
          if (-not $env:MSIX_PUBLISHER) {
            throw "MSIX_PUBLISHER secret is required; copy Package/Identity/Publisher exactly from Partner Center → Product management → Product identity"
          }
          $version = "${{ steps.tauri-version.outputs.version }}.0"
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "MSIX version must be X.Y.Z.W, got $version"
          }
          $manifest = Get-Content -Raw src-tauri/msix/Package.appxmanifest.xml
          $manifest = $manifest.Replace('__APP_VERSION__', $version)
          $manifest = $manifest.Replace('__PUBLISHER__', $env:MSIX_PUBLISHER)
          $resolvedManifest = Join-Path $env:RUNNER_TEMP "DhammaEcho.Package.appxmanifest.xml"
          Set-Content -Path $resolvedManifest -Value $manifest -NoNewline
          "MSIX_MANIFEST_PATH=$resolvedManifest" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Stage MSIX inputs
        shell: pwsh
        run: |
          $staging = "msix-staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Path "src-tauri/target/release/dhamma-echo.exe" -Destination $staging/
          Get-ChildItem -Path "src-tauri/target/release" -Filter "*.dll" |
            Copy-Item -Destination $staging/
          Copy-Item -Path $env:MSIX_MANIFEST_PATH -Destination "$staging/Package.appxmanifest.xml" -Force
          Copy-Item -Path "src-tauri/msix/Assets" -Destination $staging/ -Recurse -Force
          Get-ChildItem -Path $staging -Recurse |
            ForEach-Object { Write-Host "  staged: $($_.FullName)" }
      - name: Assert source manifest remains a template
        shell: pwsh
        run: |
          git diff --exit-code -- src-tauri/msix/Package.appxmanifest.xml
      - name: Pack MSIX (unsigned; Partner Center signs it)
        shell: pwsh
        run: |
          $version = "${{ steps.tauri-version.outputs.version }}"
          $msix = "Dhamma.Echo_${version}_x64.msix"
          winapp pack ./msix-staging --output $msix --quiet
          if (-not (Test-Path $msix)) {
            throw "winapp pack did not produce ${msix}"
          }
          Get-Item $msix | Format-List Name, Length, LastWriteTime
      - name: Attach MSIX to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Dhamma.Echo_${{ steps.tauri-version.outputs.version }}_x64.msix
          fail_on_unmatched_files: true
      - name: Remove temporary MSIX files
        if: always()
        shell: pwsh
        run: |
          if ($env:MSIX_MANIFEST_PATH -and (Test-Path $env:MSIX_MANIFEST_PATH)) {
            Remove-Item -Path $env:MSIX_MANIFEST_PATH -Force
          }
          if (Test-Path "msix-staging") {
            Remove-Item -Path "msix-staging" -Recurse -Force
          }
  publish-pages:
    name: Publish Windows installer to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Verify product site
        run: bun run site:verify
      - name: Download Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf docs/downloads
          mkdir -p docs/downloads
          gh release download "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*_x64-setup.exe' \
            --dir docs/downloads \
            --clobber
          shopt -s nullglob
          installers=(docs/downloads/*_x64-setup.exe)
          test "${#installers[@]}" -eq 1
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
