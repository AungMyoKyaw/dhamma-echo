[package]
name = "dhamma-echo-native"
version = "0.6.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-video = "0.4"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", features = ["AVPlayerItemOutput", "AVPlayerItem", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDate", "NSDictionary", "NSNotification", "NSRunLoop", "NSString", "NSURL", "NSValue"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false }
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3", "wav"] }
